name: Quesy CI Test Suite

on:
  push:
    branches: [ main, master, feat, 'feat/**' ]
  pull_request:
    branches: [ main, master, feat ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libxml2-dev \
            libxslt1-dev \
            fonts-dejavu-core \
            fonts-freefont-ttf \
            fonts-liberation
          if ! command -v google-chrome &> /dev/null && ! command -v chromium &> /dev/null; then
            sudo apt-get install -y --no-install-recommends chromium-browser || true
          fi

      - name: Install Node.js Dependencies (MathJax Engine & Fonts)
        run: |
          npm install

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Environment & Services
        run: |
          python --version
          node --version
          which chromium-browser || which chromium || which google-chrome || echo "No browser in standard PATH"

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
          AI_PROVIDER: "gemini"
          AI_API_KEY: ""
        run: |
          python -m pytest -v --durations=10
